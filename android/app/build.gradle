plugins { id 'com.android.application' }

// The site URL is deliberately not hard-coded. CI requires an HTTPS origin.
def requestedOrigin = (findProperty('adminSiteUrl') ?: '').toString().trim()
def siteUri
try { siteUri = new URI(requestedOrigin) } catch (Exception ignored) { throw new GradleException('adminSiteUrl must be a valid HTTPS origin.') }
if (siteUri.scheme != 'https' || !siteUri.host || siteUri.userInfo || siteUri.query || siteUri.fragment || !(siteUri.path in ['', '/']) || !(siteUri.host ==~ /[A-Za-z0-9.-]+/) || siteUri.port > 65535) {
    throw new GradleException('Provide -PadminSiteUrl=https://your-site.pages.dev (HTTPS origin only).')
}
def adminUrl = "https://${siteUri.host}${siteUri.port == -1 ? '' : ':' + siteUri.port}/admin"

android {
    namespace 'com.qrstudio.admin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.qrstudio.admin'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'ADMIN_URL', '"' + adminUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
