name: Déployer Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site-public/web/**'
      - 'admin-app/web/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-pages.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Préparer les deux sites statiques
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://qr-studio-2328.pages.dev' }}
        run: bash scripts/prepare-web.sh
      - name: Déployer sur Cloudflare Pages
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy .output/public --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
        # Le nom du projet est une variable publique ; les jetons restent secrets.
        shell: bash
