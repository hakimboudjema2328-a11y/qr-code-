# Les appels clients exigent un JWT côté passerelle ET une vérification du
# compte côté fonction. Le webhook est public mais authentifié par signature.
[functions.qr-checkout]
verify_jwt = true
[functions.qr-order]
verify_jwt = true
[functions.chargily-webhook]
verify_jwt = false
# Login public limité ; le mot de passe est vérifié par Supabase Auth, puis le rôle admin est vérifié.
[functions.qr-admin-auth]
verify_jwt = false
# Connexion par code public mais protégé contre les tentatives abusives.
[functions.qr-client-auth]
verify_jwt = false
# Ces fonctions exigent un JWT et revérifient l'identité et les droits.
[functions.qr-client-admin]
verify_jwt = true
[functions.qr-client-qr]
verify_jwt = true
# L'ouverture d'un QR est publique : UUID aléatoire, contenu chiffré et statut
# vérifié à chaque requête ; la passerelle ne doit pas exiger de session.
[functions.qr-resolve]
verify_jwt = false
